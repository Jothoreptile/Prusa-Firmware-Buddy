name: Build XL firmware

on:
  push:
  workflow_dispatch:

jobs:
  build-xl:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-venv \
            ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Install requests
        run: python -m pip install requests

      - name: Build XL (release, with bootloader)
        run: python utils/build.py --preset xl --build-type release --bootloader yes --final --no-store-output

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xl-firmware
          path: build/products/*
          if-no-files-found: error
